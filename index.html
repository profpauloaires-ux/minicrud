<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MINI CRUD PREMIUM - FIREBASE</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { cursor: pointer; margin-left: 5px; }
        ul { list-style-type: none; padding: 0; }
        li { margin: 5px 0; padding: 5px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        span { min-width: 200px; display: inline-block; }
    </style>
</head>
<body>

    <h2>LISTA DE USUÁRIOS (NUVEM)</h2>

    <!-- Campo oculto para guardar o ID quando formos editar -->
    <input type="hidden" id="idNome" value="">

    <!-- Campo para digitar o nome -->
    <input type="text" id="nome" placeholder="Digite o nome do usuário...">
    <button onclick="executarSalvar()">Salvar</button>

    <br><br>

    <!-- Campo de pesquisa -->
    <input type="text" id="pesquisa" placeholder="Pesquisar usuário..." oninput="executarPesquisa()">

    <button onclick="executarLimparTudo()" style="background-color: lightcoral; color: white; border: none; padding: 4px 8px;">
        Limpar Tudo
    </button>

    <!-- Onde a lista vai aparecer -->
    <ul id="lista"></ul>

    <!-- Firebase versão 8 (Legada, estável) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // 1. Configuração do Firebase
        const firebaseConfig = {
        apiKey: "AIzaSyCcEogcWrfRr0FLTNXPehLQa2-JT0_8WhM",
        authDomain: "minicrud-1c0c9.firebaseapp.com",
        databaseURL: "https://minicrud-1c0c9-default-rtdb.firebaseio.com",
        projectId: "minicrud-1c0c9",
        storageBucket: "minicrud-1c0c9.firebasestorage.app",
        messagingSenderId: "663844691248",
        appId: "1:663844691248:web:532baca83ccb17860ebcf5"
};

        // 2. Inicialização segura
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Variável global para espelhar os dados do banco
        let nomesLocais = {};

        // 3. Ouvinte em tempo real (Roda automático sempre que o banco muda)
        db.ref("usuarios").on("value", function(snapshot) {
            nomesLocais = snapshot.val() || {};
            executarPesquisa(); // Atualiza a lista na tela imediatamente
        }, function(erro) {
            console.error("Erro no Firebase:", erro);
            alert("Erro de permissão ou conexão com o Firebase!");
        });

        // 4. FUNÇÃO SALVAR (Cria ou Atualiza)
        function executarSalvar() {
            const inputNome = document.getElementById("nome");
            const inputId = document.getElementById("idNome");
            
            const nomeValor = inputNome.value.trim();
            const idValor = inputId.value;

            if (nomeValor === "") {
                alert("Por favor, digite um nome, seu pateta!");
                return;
            }

            if (idValor === "") {
                // Novo registro (CREATE)
                db.ref("usuarios").push({ nome: nomeValor })
                    .then(function() {
                        inputNome.value = "";
                    })
                    .catch(function(error) {
                        alert("Erro ao salvar: " + error.message);
                    });
            } else {
                // Atualizar existente (UPDATE)
                db.ref("usuarios").child(idValor).set({ nome: nomeValor })
                    .then(function() {
                        inputNome.value = "";
                        inputId.value = ""; // Reseta o formulário
                    })
                    .catch(function(error) {
                        alert("Erro ao atualizar: " + error.message);
                    });
            }
        }

        // 5. FUNÇÃO FILTRAR E MONTAR A LISTA NA TELA
        function ejecutarPesquisa() { // Mapeada para o oninput do HTML alternativo
            executarPesquisa();
        }

        function executarPesquisa() {
            const filtro = document.getElementById("pesquisa").value.toLowerCase();
            const listaUl = document.getElementById("lista");
            listaUl.innerHTML = ""; // Limpa o HTML da lista anterior

            // Transforma o objeto do Firebase em chaves para varrer a estrutura
            Object.keys(nomesLocais).forEach(function(id) {
                const usuario = nomesLocais[id];
                
                // Se o nome incluir o que está digitado na busca (ou se a busca estiver vazia)
                if (usuario.nome && usuario.nome.toLowerCase().indexOf(filtro) !== -1) {
                    const li = document.createElement("li");
                    
                    li.innerHTML = `
                        <span>${usuario.nome}</span>
                        <button onclick="prepararEdicao('${id}', '${usuario.nome}')">Editar</button>
                        <button onclick="executarExcluir('${id}')" style="background-color: #ffcccc; border: 1px solid red;">Excluir</button>
                    `;
                    
                    listaUl.appendChild(li);
                }
            });
        }

        // 6. COLOCAR EM MODO DE EDIÇÃO
        function prepararEdicao(id, nome) {
            document.getElementById("idNome").value = id;
            document.getElementById("nome").value = nome;
            document.getElementById("nome").focus();
        }

        // 7. EXCLUIR REGISTRO ÚNICO
        function executarExcluir(id) {
            if (confirm("Quer mesmo deletar este usuário, Bizonho?")) {
                db.ref("usuarios").child(id).remove();
            }
        }

        // 8. LIMPAR TODO O NÓ DO BANCO
        function executarLimparTudo() {
            if (confirm("CUIDADO: Apagar TODOS os registros salvos?")) {
                db.ref("usuarios").remove()
                    .then(function() {
                        document.getElementById("pesquisa").value = "";
                    });
            }
        }
    </script>
</body>
</html>
