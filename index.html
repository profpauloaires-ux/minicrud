<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MINI CRUD PREMIUM - FIREBASE</title>
</head>
<body>

    <h2>LISTA DE USUÁRIOS (NUVEM)</h2>

    <input type="hidden" id="idNome">

    <input type="text" id="nome"
        placeholder="Digite o nome do usuário...">

    <button onclick="salvar()">Salvar</button>

    <br><br>

    <input type="text" id="pesquisa"
        placeholder="Pesquisar usuário..."
        oninput="pesquisar()">

    <button onclick="limparTudo()"
        style="background-color: lightcoral;">
        Limpar Tudo
    </button>

    <ul id="lista"></ul>

    <!-- Firebase versão 8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>

        const firebaseConfig = {
            apiKey: "AIzaSyCcEogcWrfRr0FLTNXPehLQa2-JT0_8WhM",
            authDomain: "minicrud-1c0c9.firebaseapp.com",
            databaseURL: "https://minicrud-1c0c9-default-rtdb.firebaseio.com",
            projectId: "minicrud-1c0c9",
            storageBucket: "minicrud-1c0c9.firebasestorage.app",
            messagingSenderId: "663844691248",
            appId: "1:663844691248:web:532baca83ccb17860ebcf5"
        };

        firebase.initializeApp(firebaseConfig);

        const db = firebase.database();

        let nomesLocais = {};

        // LEITURA AUTOMÁTICA
        db.ref("usuarios").on("value", (snapshot) => {

            nomesLocais = snapshot.val() || {};

            pesquisar();

        }, (erro) => {
            console.error("Erro ao carregar dados:", erro);
            alert("Erro ao carregar os usuários!");
        });

        // SALVAR
        function salvar() {

            let input = document.getElementById("nome");

            let id = document.getElementById("idNome").value;

            let nome = input.value.trim();

            if (nome === "") {
                alert("Digite um nome!");
                return;
            }

            let operacao;

            if (id === "") {
            // Alinhando o push para retornar uma Promise tratável pelo .then()
             operacao = db.ref("usuarios").push().set({ nome: nome });
            } else {
                operacao = db.ref("usuarios/" + id).update({ nome: nome });
            

            }

            operacao.then(() => {

                input.value = "";

                document.getElementById("idNome").value = "";

            }).catch((erro) => {

                console.error(erro);

                alert("Erro ao salvar: " + erro.message);

            });

        }

        // DESENHAR TELA
        function desenharTela(dados) {

            let lista = document.getElementById("lista");

            lista.innerHTML = "";

            Object.keys(dados).forEach((id) => {

                let usuario = dados[id];

                let li = document.createElement("li");

                li.appendChild(
                    document.createTextNode(usuario.nome + " ")
                );

                let btnEditar = document.createElement("button");

                btnEditar.textContent = "Editar";

                btnEditar.onclick = () => editar(id);

                let btnExcluir = document.createElement("button");

                btnExcluir.textContent = "Excluir";

                btnExcluir.onclick = () => deletar(id);

                li.appendChild(btnEditar);

                li.appendChild(btnExcluir);

                lista.appendChild(li);

            });

        }

        // EDITAR
        function editar(id) {

            document.getElementById("nome").value =
                nomesLocais[id].nome;

            document.getElementById("idNome").value = id;

        }

        // EXCLUIR
        function deletar(id) {

            if (confirm("Deseja excluir este usuário?")) {

                db.ref("usuarios/" + id).remove()
                    .catch(erro => {
                        alert("Erro ao excluir: " + erro.message);
                    });

            }

        }

        // LIMPAR TUDO
        function limparTudo() {

            if (confirm("Deseja apagar todos os usuários?")) {

                db.ref("usuarios").remove()
                    .then(() => {

                        document.getElementById("pesquisa").value = "";

                    })
                    .catch(erro => {

                        alert("Erro ao limpar: " + erro.message);

                    });

            }

        }

        // PESQUISAR
        function pesquisar() {

            let termo = document.getElementById("pesquisa")
                .value.toLowerCase();

            let filtrados = {};

            Object.keys(nomesLocais).forEach((id) => {

                let nome = nomesLocais[id].nome || "";

                if (nome.toLowerCase().includes(termo)) {

                    filtrados[id] = nomesLocais[id];

                }

            });

            desenharTela(filtrados);

        }

    </script>

</body>
</html>
