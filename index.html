<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>MINI CRUD PREMIUM - FIREBASE</title>
</head>
<body>

    <h2>LISTA DE USUÁRIOS (NUVEM)</h2>

    <input type="hidden" id="idNome">

    <input type="text" id="nome" placeholder="Digite o nome do usuário...">

    <button onclick="salvar()">Salvar</button>

    <br><br>

    <input type="text" id="pesquisa" placeholder="Pesquisar usuário..." oninput="pesquisar()">

    <button onclick="limparTudo()" style="background-color: lightcoral;">
        Limpar Tudo
    </button>

    <ul id="lista"></ul>

    <!-- Firebase versão 8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcEogcWrfRr0FLTNXPehLQa2-JT0_8WhM",
            authDomain: "minicrud-1c0c9.firebaseapp.com",
            databaseURL: "https://minicrud-1c0c9-default-rtdb.firebaseio.com",
            projectId: "minicrud-1c0c9",
            storageBucket: "minicrud-1c0c9.firebasestorage.app",
            messagingSenderId: "663844691248",
            appId: "1:663844691248:web:532baca83ccb17860ebcf5"
        };

        // Inicialização correta para a versão 8
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let nomesLocais = {};

        // LEITURA AUTOMÁTICA
        db.ref("usuarios").on("value", (snapshot) => {
            nomesLocais = snapshot.val() || {};
            pesquisar();
        }, (erro) => {
            console.error("Erro ao carregar dados:", erro);
            alert("Erro ao carregar os usuários!");
        });

        // SALVAR
        function salvar() {
            let input = document.getElementById("nome");
            let idInput = document.getElementById("idNome");
            let nomeValor = input.value.trim();

            if (nomeValor === "") {
                alert("Digite um nome válido!");
                return;
            }

            // Se tiver idNome preenchido, atualiza. Se não, cria um novo (push)
            if (idInput.value) {
                db.ref("usuarios/" + idInput.value).set({ nome: nomeValor });
            } else {
                db.ref("usuarios").push({ nome: nomeValor });
            }

            input.value = "";
            idInput.value = "";
        }

        // PESQUISAR / LISTAR
        function pesquisar() {
            let termo = document.getElementById("pesquisa").value.toLowerCase();
            let lista = document.getElementById("lista");
            lista.innerHTML = "";

            for (let id in nomesLocais) {
                let usuario = nomesLocais[id];
                if (usuario.nome.toLowerCase().includes(termo)) {
                    let li = document.createElement("li");
                    li.innerHTML = `${usuario.nome} 
                        <button onclick="editar('${id}', '${usuario.nome}')">Editar</button>
                        <button onclick="remover('${id}')">Excluir</button>`;
                    lista.appendChild(li);
                }
            }
        }

        // EDITAR
        function editar(id, nome) {
            document.getElementById("idNome").value = id;
            document.getElementById("nome").value = nome;
        }

        // REMOVER
        function remover(id) {
            if (confirm("Deseja realmente excluir este usuário?")) {
                db.ref("usuarios/" + id).remove();
            }
        }

        // LIMPAR TUDO
        function limparTudo() {
            if (confirm("Tem certeza que deseja apagar TODOS os usuários da nuvem?")) {
                db.ref("usuarios").remove();
            }
        }
    </script>
</body>
</html>
